name: Jellyfin 12 rewrite validation

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewrite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # The migration inventory compares the pinned baseline commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      # The runner context is not available in job-level env, so the lock path is set here.
      - run: echo "JE_VALIDATION_LOCK=$RUNNER_TEMP/je-v12-validation.lock" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run verify:rewrite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rewrite-validation
          path: artifacts/regression/
          retention-days: 14
