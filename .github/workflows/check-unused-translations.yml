name: "Check Unused Translation Keys"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-unused-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Check for unused translation keys
        run: |
          echo "Scanning for unused translation keys..."
          node scripts/validate-translations.js find-unused
