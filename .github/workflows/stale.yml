name: "Close stale issues and PRs"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          stale-issue-message: >
            This issue has been marked as stale because it has had no activity for 15 days.
            It will be closed in 3 days if no further activity occurs.
          stale-pr-message: >
            This pull request has been marked as stale due to 15 days of inactivity.
            It will be closed in 3 days if no updates are made.
          days-before-stale: 15
          days-before-close: 3
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "help wanted, open-for-discussion, enhancement, no-stale"
          exempt-draft-pr: true
