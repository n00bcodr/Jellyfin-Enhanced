name: Regression tests

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Separate job: a stale inventory fails this check without skipping the tests.
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tests/inventory/generate.py --check

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [jf10, jf12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: python3 tests/run.py backend --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-${{ matrix.target }}
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/regression/backend/
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests/runner/tests -v
      - run: python3 tests/run.py frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/frontend-coverage/
            coverage/
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: python3 tests/run.py browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/browser/
            playwright-report/
            test-results/
          retention-days: 14

  host:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [jf10, jf12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 tests/run.py host --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: host-${{ matrix.target }}
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/regression/host/
          retention-days: 14

  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Matches the ICU version used to generate poster language tables.
          node-version: '26.2.0'
          cache: npm
      - run: npm ci
      - run: python3 tests/run.py poster --artifacts artifacts/regression/poster-run
      - run: python3 tests/run.py mutation --artifacts artifacts/regression/mutation-run
        if: always()
      - run: python3 tests/run.py history --artifacts artifacts/regression/history-run
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extended-results
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/regression/poster-run/
            artifacts/regression/mutation-run/
            artifacts/regression/history-run/
          retention-days: 14
