name: Regression tests

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Separate job: a stale inventory fails this check without skipping the tests.
  # Pushes to main are handled by inventory-sync instead.
  inventory:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Check inventory
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The PR merge commit's first parent is the base branch; drift already there only warns.
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            python3 tests/inventory/generate.py --check --base "$RUNNER_TEMP/base"
          else
            python3 tests/inventory/generate.py --check
          fi

  # Commits a regenerated inventory when a push to main left it stale.
  inventory-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'n00bcodr/Jellyfin-Enhanced'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Regenerate and commit if stale
        run: |
          python3 tests/inventory/generate.py
          if git diff --quiet -- tests/docs/production-inventory.json; then
            echo 'Production inventory is current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(tests): regenerate production inventory' -- tests/docs/production-inventory.json
          git push origin HEAD:main

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [jf10, jf12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      # Dependabot bumps package versions but cannot update the per-target lock files
      # (packages.jf10/jf12.lock.json), so the locked restore below would stop with NU1004.
      # Regenerate this target's lock files and fail with the fix instead.
      - name: Check NuGet lock files (Dependabot)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for project in Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj tests/backend/JE.Tests.csproj; do
            dotnet restore "$project" -p:JellyfinTarget="$TARGET" --force-evaluate
          done
          if ! git diff --quiet -- '*.lock.json'; then
            git --no-pager diff -- '*.lock.json'
            echo "::error::The $TARGET NuGet lock files are out of date after this dependency update. Regenerate both targets' lock files as described in CONTRIBUTING.md (NuGet lock files) and push them to this branch."
            exit 1
          fi
      - run: python3 tests/run.py backend --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-${{ matrix.target }}
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/regression/backend/
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests/runner/tests -v
      - run: python3 tests/run.py frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/frontend-coverage/
            coverage/
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: python3 tests/run.py browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/browser/
            playwright-report/
            test-results/
          retention-days: 14

  host:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [jf10, jf12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 tests/run.py host --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: host-${{ matrix.target }}
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/regression/host/
          retention-days: 14

  extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Matches the ICU version used to generate poster language tables.
          node-version: '26.2.0'
          cache: npm
      - run: npm ci
      - run: python3 tests/run.py poster --artifacts artifacts/regression/poster-run
      - run: python3 tests/run.py mutation --artifacts artifacts/regression/mutation-run
        if: always()
      - run: python3 tests/run.py history --artifacts artifacts/regression/history-run
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extended-results
          path: |
            artifacts/regression/*.log
            artifacts/regression/summary.json
            artifacts/regression/poster-run/
            artifacts/regression/mutation-run/
            artifacts/regression/history-run/
          retention-days: 14
