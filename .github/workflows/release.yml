name: Build and Release Spoiler Guard Lite

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manifest.json'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Jellyfin 12)
        run: dotnet build Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj -c Release -p:JellyfinTarget=jf12

      - name: Stage plugin DLLs
        run: |
          rm -rf staging && mkdir staging
          cp Jellyfin.Plugin.JellyfinEnhanced/bin/Release/net10.0/*.dll staging/
          rm -f staging/Jellyfin.Controller.dll staging/Jellyfin.Model.dll staging/MediaBrowser.*.dll staging/Microsoft.*.dll staging/System.*.dll

      - name: Create release zip
        run: |
          cd staging && zip -r ../SpoilerGuardLite.zip . && cd ..
          echo "MD5=$(md5sum SpoilerGuardLite.zip | awk '{print $1}')" >> $GITHUB_ENV

      - name: Compute next version
        id: ver
        run: |
          CUR=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj)
          IFS='.' read -r a b c d <<< "$CUR"
          d=$((d+1))
          NEW="$a.$b.$c.$d"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          sed -i "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$NEW</AssemblyVersion>|" Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj
          sed -i "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$NEW</FileVersion>|" Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj
          echo "Bumped $CUR -> $NEW"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Spoiler Guard Lite v${{ steps.ver.outputs.version }}
          files: SpoilerGuardLite.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest checksum
        run: |
          CHECKSUM=$(md5sum SpoilerGuardLite.zip | awk '{print $1}')
          VERSION=${{ steps.ver.outputs.version }}
          python3 - "$CHECKSUM" "$VERSION" <<'PY'
          import json, sys
          p='manifest.json'
          d=json.load(open(p))
          d[0]['versions'][0]['checksum']=sys.argv[1]
          d[0]['versions'][0]['version']=sys.argv[2]
          d[0]['versions'][0]['sourceUrl']="https://github.com/Subject412/SpoilerGuard/releases/download/v" + sys.argv[2] + "/SpoilerGuardLite.zip"
          json.dump(d, open(p,'w'), indent=2)
          open(p,'a').write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json Jellyfin.Plugin.JellyfinEnhanced/JellyfinEnhanced.csproj
          git commit -m "chore(manifest): auto-update to v$VERSION [skip ci]" || echo "No changes"
          for i in 1 2 3; do git pull --rebase origin main && break; sleep 5; done
          git push origin main
