name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/docs/requirements.txt'
      - 'overrides/**'
      - '.github/workflows/docs.yml'
      - 'Jellyfin.Plugin.JellyfinEnhanced/Configuration/configPage.html'
      - 'Jellyfin.Plugin.JellyfinEnhanced/Configuration/PluginConfiguration.cs'
      - 'scripts/generate_config_flag_groups.py'
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as this released docs version (e.g. 12.15). Leave empty to publish "dev".'
        required: false
      ref:
        description: 'Tag or branch to build the docs from (e.g. 12.15.0.0). Leave empty to use the ref the workflow runs on. Use it to back fill older releases.'
        required: false
      latest:
        description: 'Also make this release the "latest" default (turn off when back filling an older release)'
        type: boolean
        default: true

permissions:
  contents: read

# One writer at a time: every run pushes to the gh-pages branch.
concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pushes the built docs to the gh-pages branch
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      # Always the current tooling (it includes mike), even when an older tag is being built.
      - name: Install dependencies
        run: |
          git show origin/main:.github/docs/requirements.txt > "$RUNNER_TEMP/docs-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/docs-requirements.txt"

      - name: Install Node dependencies
        run: '[ ! -f package-lock.json ] || npm ci --ignore-scripts'

      - name: Generate config flag groups
        run: '[ ! -f scripts/generate_config_flag_groups.py ] || python scripts/generate_config_flag_groups.py'

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A tag push (12.15.1.0) or a manual run with "release" set publishes a released version
      # named major.minor (12.15). It also moves the "latest" alias and the site default to it unless
      # "latest" is off (back filling an older release). Any other run (a push to main) publishes
      # "dev" (titled "main"), the unreleased docs. A tag from before the version switcher existed is built with an
      # extra config that adds it.
      - name: Publish docs version
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          RELEASE=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then RELEASE="$GITHUB_REF_NAME"; fi
          if [[ -n "$INPUT_RELEASE" ]]; then RELEASE="$INPUT_RELEASE"; fi
          CONFIG=mkdocs.yml
          if ! grep -q "provider: mike" mkdocs.yml; then
            {
              echo "INHERIT: mkdocs.yml"
              echo "extra:"
              echo "  version:"
              echo "    provider: mike"
              echo "    default: latest"
            } > .mkdocs-mike.yml
            CONFIG=.mkdocs-mike.yml
          fi
          if [[ -z "$RELEASE" ]]; then
            mike deploy --config-file "$CONFIG" --push --title "main" dev
          else
            VERSION=$(echo "$RELEASE" | cut -d. -f1,2)
            if [[ "$INPUT_LATEST" == "false" ]]; then
              mike deploy --config-file "$CONFIG" --push "$VERSION"
            else
              # The newest release is titled "latest (12.15)"; the one it replaces gets its plain version title back.
              PREV=$(mike list --json | python3 -c "import json,sys; print(next((v['version'] for v in json.load(sys.stdin) if 'latest' in v['aliases']), ''))")
              mike deploy --config-file "$CONFIG" --push --update-aliases --title "latest ($VERSION)" "$VERSION" latest
              if [[ -n "$PREV" && "$PREV" != "$VERSION" ]]; then mike retitle --push "$PREV" "$PREV"; fi
              mike set-default --config-file "$CONFIG" --push latest
            fi
          fi
