name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/docs/requirements.txt'
      - 'overrides/**'
      - '.github/workflows/docs.yml'
      - 'Jellyfin.Plugin.JellyfinEnhanced/Configuration/configPage.html'
      - 'Jellyfin.Plugin.JellyfinEnhanced/Configuration/PluginConfiguration.cs'
      - 'scripts/generate_config_flag_groups.py'
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the selected branch/tag as this released docs version (e.g. 12.15). Leave empty to publish "dev".'
        required: false

permissions:
  contents: write

# One writer at a time: every run pushes to the gh-pages branch.
concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Install dependencies
        run: |
          pip install --require-hashes -r .github/docs/requirements.txt

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Generate config flag groups
        run: python scripts/generate_config_flag_groups.py

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A tag push (12.15.1.0) or a manual run with "release" set publishes a released version
      # named major.minor (12.15) and moves the "latest" alias to it. Any other run (a push to
      # main) publishes "dev", the unreleased docs.
      - name: Publish docs version
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          RELEASE=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then RELEASE="$GITHUB_REF_NAME"; fi
          if [[ -n "$INPUT_RELEASE" ]]; then RELEASE="$INPUT_RELEASE"; fi
          if [[ -n "$RELEASE" ]]; then
            VERSION=$(echo "$RELEASE" | cut -d. -f1,2)
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push --title "dev (unreleased)" dev
          fi
