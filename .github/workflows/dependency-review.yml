name: 'Dependency Review'

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate bot token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          repo-token: ${{ steps.app-token.outputs.token || github.token }}
          # Fail the action if vulnerabilities are found
          fail-on-severity: moderate
          # Comment on the PR with the results
          comment-summary-in-pr: always
          # Allow only the licenses actually present across NuGet packages and GitHub
          # Actions used by this repo (GPL-3.0-only comes from Jellyfin.Controller/Model,
          # the rest are MIT/Apache-2.0). `deny-licenses` is deprecated upstream in favor
          # of this allow-list model: https://github.com/actions/dependency-review-action/issues/997
          # BSD-2-Clause, BSD-3-Clause and MPL-2.0 come from the MkDocs toolchain pinned in
          # .github/docs/requirements.txt (docs build only, never shipped).
          allow-licenses: MIT, Apache-2.0, GPL-3.0-only, BSD-2-Clause, BSD-3-Clause, MPL-2.0
          # Allow the CI-only TruffleHog GitHub Action despite its AGPL license classification,
          # and the test-only Moq mocking library (BSD-3-Clause; tests/backend, never shipped).
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog, pkg:nuget/Moq
