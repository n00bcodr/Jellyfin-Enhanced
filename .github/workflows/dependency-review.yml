name: 'Dependency Review'

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate bot token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          repo-token: ${{ steps.app-token.outputs.token || github.token }}
          # Fail the action if vulnerabilities are found
          fail-on-severity: moderate
          # Comment on the PR with the results
          comment-summary-in-pr: always
          # Allow only the licenses actually present across NuGet packages and GitHub
          # Actions used by this repo (GPL-3.0-only comes from Jellyfin.Controller/Model,
          # the rest are MIT/Apache-2.0). `deny-licenses` is deprecated upstream in favor
          # of this allow-list model: https://github.com/actions/dependency-review-action/issues/997
          allow-licenses: MIT, Apache-2.0, GPL-3.0-only
          # Allow the CI-only TruffleHog GitHub Action despite its AGPL license classification,
          # and the test-only Moq mocking library (BSD-3-Clause; tests/backend, never shipped).
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog, pkg:nuget/Moq
