name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Saturdays at 3:00 AM UTC
    - cron: '0 3 * * 6'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: results.sarif
