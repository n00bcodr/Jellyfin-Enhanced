name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Saturdays at 3:00 AM UTC
    - cron: '0 3 * * 6'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          sarif_file: results.sarif
