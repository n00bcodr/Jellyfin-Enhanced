<div id="je-loading">Loading…</div>
<div data-role="content">
  <div class="content-primary je-catchup-page" style="padding: 0 !important;">
    <div id="je-catchup-container"></div>
  </div>
</div>
<div id="je-error" style="display:none">
  Jellyfin Enhanced not ready.
</div>
<script>
(function () {
  const MAX_WAIT = 5000;
  const INTERVAL = 50;
  let waited = 0;

  const loadingEl = document.getElementById("je-loading");
  const errorEl = document.getElementById("je-error");
  const preferencesPages = Array.from(document.querySelectorAll("#userPluginPreferencesPage"));
  const preferencesPage = preferencesPages.find(p => p.offsetWidth > 0 && p.offsetHeight > 0);

  document.querySelectorAll("#je-catchup-container").forEach(el => {
    if (!preferencesPage || !preferencesPage.contains(el)) {
      el.remove();
    }
  });

  if (preferencesPage && !preferencesPage.querySelector("#je-catchup-container")) {
    const newContainer = document.createElement("div");
    newContainer.id = "je-catchup-container";
    const target = document.querySelector(".je-catchup-page") || document.body;
    target.appendChild(newContainer);
  }

  const JE = window.JellyfinEnhanced;

  const timer = setInterval(() => {
    if (JE && JE.catchUpPage) {
      clearInterval(timer);

      loadingEl.remove();
      JE.catchUpPage.injectStyles();
      JE.catchUpPage.renderPage();
      return;
    }

    waited += INTERVAL;
    if (waited >= MAX_WAIT) {
      clearInterval(timer);

      loadingEl.style.display = "none";
      errorEl.style.display = "block";
    }
  }, INTERVAL);
})();
</script>
