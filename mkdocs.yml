site_name: Jellyfin Enhanced
site_url: https://n00bcodr.github.io/Jellyfin-Enhanced/
repo_name: n00bcodr/Jellyfin-Enhanced
repo_url: https://github.com/n00bcodr/Jellyfin-Enhanced
site_description: The essential enhancement suite for Jellyfin, bundling advanced features and customizations into one convenient plugin.
site_author: n00bcodr
copyright: Copyright &copy;2026 n00bcodr. Made with 💜 for Jellyfin and the community

theme:
  name: material
  # JE look: template overrides for the logo mark, nav/tab icons (overrides/partials/je-icons.html),
  # the section bar above each page title, area names in titles, and the footer key hint
  custom_dir: overrides
  logo: images/favicon.ico
  favicon: images/favicon.ico
  # Jellyfin's own UI font
  font:
    text: Noto Sans
    code: Noto Sans Mono
  icon:
    previous: material/chevron-left
    next: material/chevron-right
    top: material/arrow-up
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss
extra:
  404_page: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/n00bcodr/Jellyfin-Enhanced
      name: GitHub Repository
    - icon: fontawesome/brands/discord
      link: https://discord.gg/EYNFf7y4CG
      name: Jellyfin Community Discord - Jellyfin Enhanced Channel

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # Click any screenshot to open it full size
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - no-lightbox

markdown_extensions:
  - meta
  - toc:
      permalink: true
      title: On this page
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # lists
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  # keyboard shortcuts
  - pymdownx.keys
  # simple text formatting
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  # icons (:material-...:, :fontawesome-...:) for cards and buttons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mdx_truly_sane_lists


# main tabs/headers — at most two levels: every area is a top tab, its pages sit directly under it
nav:
  - Home: index.md

  - Getting Started:
    - Quick Start: getting-started/index.md
    - Installation: installation/installation.md
    - Compatibility: getting-started/compatibility.md
    - Settings Overview: getting-started/settings-overview.md
    - JE Pages & Tabs: getting-started/pages-and-tabs.md
    - Troubleshooting: installation/troubleshooting.md

  - Enhanced:
    - Features: enhanced/enhanced-features.md
    - Tags & Badges: enhanced/tags.md
    - Settings: enhanced/enhanced-settings.md

  - Spoiler Guard:
    - Features: spoiler-guard/spoiler-guard-features.md
    - Settings: spoiler-guard/spoiler-guard-settings.md

  - Seerr:
    - Features: seerr/seerr-features.md
    - Settings: seerr/seerr-settings.md
    - Permission Audit: seerr/permission-audit.md

  - "*arr":
    - Features: arr/arr-features.md
    - Settings: arr/arr-settings.md
    - Troubleshooting: arr/troubleshooting-support.md

  - Elsewhere:
    - Features: elsewhere/elsewhere-features.md
    - Settings: elsewhere/elsewhere-settings.md

  - Other:
    - Features: other/other-features.md
    - Settings: other/other-settings.md

  - Advanced:
    - CSS Customization: advanced/css-customization.md
    - API: advanced/api.md
    - Community Analytics: advanced/community-analytics.md
    - Project Structure: advanced/project-structure.md

  - Help:
    - FAQ: faq-support/faq.md
    - Report Issues: faq-support/report-issues.md
    - Feature Requests: faq-support/feature-requests.md
    - Contributing Translations: faq-support/contributing-translations.md
    - Support + Community: faq-support/support.md
    - Related Projects: other-projects/other-projects.md
    - About: about.md

exclude_docs: |
  /404.md

# Report broken links and anchors at build time
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css
  - stylesheets/touch.css
extra_javascript:
  - javascripts/extra.js
