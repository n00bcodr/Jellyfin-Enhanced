blic to share his technology with the military. Unwilling to let go of his invention, Stark, with Pepper Potts and James 'Rhodey' Rhodes at his side, must forge new alliances – and confront powerful enemies.","id":10138,"rt":124,"i":"/6WBeq4fCfn7AN0o21W9qNcRF2l9.jpg","a1":"#1a5b73","a2":"#afc7cd","guid":"plex://movie/5d776834a091de001f2e7cf9","imdb":"tt1228705","ps":"iron-man-2","rd":"2010-04-28"},{"n":"The Incredible Hulk","ov":"Scientist Bruce Banner scours the planet for an antidote to the unbridled force of rage within him: the Hulk. But when the military masterminds who dream of exploiting his powers force him back to civilization, he finds himself coming face to face with a new, deadly foe.","id":1724,"rt":114,"i":"/gKzYx79y0AQTL4UAk1cBQJ3nvrm.jpg","a1":"#1c344c","a2":"#c9bd9f","guid":"plex://movie/5d77682a961905001eb91cff","imdb":"tt0800080","ps":"the-incredible-hulk","rd":"2008-06-12"},{"n":"Thor","ov":"Against his father Odin's will, The Mighty Thor - a powerful but arrogant warrior god - recklessly reignites an ancient war. Thor is cast down to Earth and forced to live among humans as punishment. Once here, Thor learns what it takes to be a true hero when the most dangerous villain of his world sends the darkest forces of Asgard to invade Earth.","id":10195,"rt":115,"i":"/prSfAi1xGrhLQNxVSUFh61xQ4Qy.jpg","a1":"#1b5069","a2":"#a4c4d2","guid":"plex://movie/5d776834961905001eb93a9c","imdb":"tt0800369","ps":"thor","rd":"2011-04-27"},{"n":"The Avengers","ov":"When an unexpected enemy emerges and threatens global safety and security, Nick Fury, director of the international peacekeeping agency known as S.H.I.E.L.D., finds himself in need of a team to pull the world back from the brink of disaster. Spanning the globe, a daring recruitment effort begins!","id":24428,"rt":143,"i":"/RYMX2wcKCBAr24UyPD7xwmjaTn.jpg","a1":"#0a4e5a","a2":"#a5bbbd","guid":"plex://movie/5d77684d61141d001fb181b9","imdb":"tt0848228","ps":"the-avengers","rd":"2012-04-25"},{"n":"Thor: The Dark World","ov":"Thor fights to restore order across the cosmos… but an ancient race led by the vengeful Malekith returns to plunge the universe back into darkness. Faced with an enemy that even Odin and Asgard cannot withstand, Thor must embark on his most perilous and personal journey yet, one that will reunite him with Jane Foster and force him to sacrifice everything to save us all.","id":76338,"rt":112,"i":"/wp6OxE4poJ4G7c0U2ZIXasTSMR7.jpg","a1":"#06393e","a2":"#d6d4b0","guid":"plex://movie/5d7768ba07c4a5001e67bd10","imdb":"tt1981115","ps":"thor-the-dark-world","rd":"2013-10-30"},{"n":"Iron Man 3","ov":"When Tony Stark's world is torn apart by a formidable terrorist called the Mandarin, he starts an odyssey of rebuilding and retribution.","id":68721,"rt":130,"i":"/qhPtAc1TKbMPqNvcdXSOn9Bn7hZ.jpg","a1":"#7a1d11","a2":"#c09779","guid":"plex://movie/5d7768ad3ab0e7001f50786e","imdb":"tt1300854","ps":"iron-man-3","rd":"2013-04-18"},{"n":"Captain America: The Winter Soldier","ov":"After the cataclysmic events in New York with The Avengers, Steve Rogers, aka Captain America is living quietly in Washington, D.C. and trying to adjust to the modern world. But when a S.H.I.E.L.D. colleague comes under attack, Steve becomes embroiled in a web of intrigue that threatens to put the world at risk. Joining forces with the Black Widow, Captain America struggles to expose the ever-widening conspiracy while fighting off professional assassins sent to silence him at every turn. When the full scope of the villainous plot is revealed, Captain America and the Black Widow enlist the help of a new ally, the Falcon. However, they soon find themselves up against an unexpected and formidable enemy—the Winter Soldier.","id":100402,"rt":136,"i":"/tVFRpFw3xTedgPGqxW0AOI8Qhh0.jpg","a1":"#6c3c24","a2":"#d5cfae","guid":"plex://movie/5d77690896b655001fdc8aca","imdb":"tt1843866","ps":"captain-america-the-winter-soldier","rd":"2014-03-20"},{"n":"Guardians of the Galaxy","ov":"Light years from Earth, 26 years after being abducted, Peter Quill finds himself the prime target of a manhunt after discovering an orb wanted by Ronan the Accuser.","id":118340,"rt":121,"i":"/r7vmZjiyZw9rpJMQJdXpjgiCOk9.jpg","a1":"#0c2c64","a2":"#b9b8cc","guid":"plex://movie/5d77696ef617c9002015f700","imdb":"tt2015381","ps":"guardians-of-the-galaxy","rd":"2014-07-30"},{"n":"Guardians of the Galaxy Vol. 2","ov":"The Guardians must fight to keep their newfound family together as they unravel the mysteries of Peter Quill's true parentage.","id":283995,"rt":137,"i":"/y4MBh0EjBlMuOzv9axM4qJlmhzz.jpg","a1":"#951e0c","a2":"#d8c9bf","guid":"plex://movie/5d776b057a53e9001e71734b","imdb":"tt3896198","ps":"guardians-of-the-galaxy-vol-2","rd":"2017-04-25"},{"n":"Avengers: Age of Ultron","ov":"When Tony Stark tries to jumpstart a dormant peacekeeping program, things go awry and Earth’s Mightiest Heroes are put to the ultimate test as the fate of the planet hangs in the balance. As the villainous Ultron emerges, it is up to The Avengers to stop him from enacting his terrible plans, and soon uneasy alliances and unexpected action pave the way for an epic and unique global adventure.","id":99861,"rt":141,"i":"/4ssDuvEDkSArWEdyBl2X5EHvYKU.jpg","a1":"#7e111e","a2":"#c5a8ab","guid":"plex://movie/5d77690623d5a3001f4f4ab6","imdb":"tt2395427","ps":"avengers-age-of-ultron","rd":"2015-04-22"},{"n":"Ant-Man","ov":"Armed with the astonishing ability to shrink in scale but increase in strength, master thief Scott Lang must embrace his inner-hero and help his mentor, Doctor Hank Pym, protect the secret behind his spectacular Ant-Man suit from a new generation of towering threats. Against seemingly insurmountable obstacles, Pym and Lang must plan and pull off a heist that will save the world.","id":102899,"rt":117,"i":"/rQRnQfUl3kfp78nCWq8Ks04vnq1.jpg","a1":"#7c171b","a2":"#90b0c8","guid":"plex://movie/5d77690f7a53e9001e6e05a8","imdb":"tt0478970","ps":"ant-man","rd":"2015-07-14"},{"n":"Captain America: Civil War","ov":"Following the events of Age of Ultron, the collective governments of the world pass an act designed to regulate all superhuman activity. This polarizes opinion amongst the Avengers, causing two factions to side with Iron Man or Captain America, which causes an epic battle between former allies.","id":271110,"rt":147,"i":"/rAGiXaUfPzY7CDEyNKUofk3Kw2e.jpg","a1":"#6e0b0e","a2":"#bccadc","guid":"plex://movie/5d776adcfb0d55001f553b34","imdb":"tt3498820","ps":"captain-america-civil-war","rd":"2016-04-27"},{"n":"Black Widow","ov":"Natasha Romanoff, also known as Black Widow, confronts the darker parts of her ledger when a dangerous conspiracy with ties to her past arises. Pursued by a force that will stop at nothing to bring her down, Natasha must deal with her history as a spy and the broken relationships left in her wake long before she became an Avenger.","id":497698,"rt":134,"i":"/qAZ0pzat24kLdO3o8ejmbLxyOac.jpg","a1":"#7c090a","a2":"#c1b0af","guid":"plex://movie/5d776d9847dd6e001f6f4847","imdb":"tt3480822","ps":"black-widow-2021","rd":"2021-07-07"},{"n":"Doctor Strange","ov":"After his career is destroyed, a brilliant but arrogant surgeon gets a new lease on life when a sorcerer takes him under her wing and trains him to defend the world against evil.","id":284052,"rt":115,"i":"/uGBVj3bEbCoZbDjjl9wTxcygko1.jpg","a1":"#6e3019","a2":"#a3b6ce","guid":"plex://movie/5d776b05ad5437001f7902ac","imdb":"tt1211837","ps":"doctor-strange-2016","rd":"2016-10-25"},{"n":"Black Panther","ov":"King T'Challa returns home to the reclusive, technologically advanced African nation of Wakanda to serve as his country's new leader. However, T'Challa soon finds that he is challenged for the throne by factions within his own country as well as without. Using powers reserved to Wakandan kings, T'Challa assumes the Black Panther mantle to join with ex-girlfriend Nakia, the queen-mother, his princess-kid sister, members of the Dora Milaje (the Wakandan 'special forces') and an American secret agent, to prevent Wakanda from being dragged into a world war.","id":284054,"rt":135,"i":"/uxzzxijgPIY7slzFvMotPv8wjKA.jpg","a1":"#094683","a2":"#d2ceba","guid":"plex://movie/5d776b05fb0d55001f559234","imdb":"tt1825683","ps":"black-panther","rd":"2018-02-13"},{"n":"Spider-Man: Homecoming","ov":"Following the events of Captain America: Civil War, Peter Parker, with the help of his mentor Tony Stark, tries to balance his life as an ordinary high school student in Queens, New York City, with fighting crime as his superhero alter ego Spider-Man as a new threat, the Vulture, emerges.","id":315635,"rt":133,"i":"/c24sv2weTHPsmDa7jEMN0m2P3RT.jpg","a1":"#92571c","a2":"#d1b6a2","guid":"plex://movie/5d776b5e7a53e9001e7238e0","imdb":"tt2250912","ps":"spider-man-homecoming","rd":"2017-07-05"},{"n":"Thor: Ragnarok","ov":"Thor is imprisoned on the other side of the universe and finds himself in a race against time to get back to Asgard to stop Ragnarok, the destruction of his home-world and the end of Asgardian civilization, at the hands of a powerful new threat, the ruthless Hela.","id":284053,"rt":131,"i":"/rzRwTcFvttcN1ZpX2xv4j3tSdJu.jpg","a1":"#0c3465","a2":"#b6c1c2","guid":"plex://movie/5d776b0547dd6e001f6da17c","imdb":"tt3501632","ps":"thor-ragnarok","rd":"2017-10-24"},{"n":"Ant-Man and the Wasp","ov":"Just when his time under house arrest is about to end, Scott Lang once again puts his freedom at risk to help Hope van Dyne and Dr. Hank Pym dive into the quantum realm and try to accomplish, against time and any chance of success, a very dangerous rescue mission.","id":363088,"rt":119,"i":"/cFQEO687n1K6umXbInzocxcnAQz.jpg","a1":"#8f140f","a2":"#d09c9a","guid":"plex://movie/5d776be596b655001fe1f7fa","imdb":"tt5095030","ps":"ant-man-and-the-wasp","rd":"2018-07-04"},{"n":"Avengers: Infinity War","ov":"As the Avengers and their allies have continued to protect the world from threats too large for any one hero to handle, a new danger has emerged from the cosmic shadows: Thanos. A despot of intergalactic infamy, his goal is to collect all six Infinity Stones, artifacts of unimaginable power, and use them to inflict his twisted will on all of reality. Everything the Avengers have fought for has led up to this moment - the fate of Earth and existence itself has never been more uncertain.","id":299536,"rt":149,"i":"/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg","a1":"#0e2a50","a2":"#7972b0","guid":"plex://movie/5d776b377a53e9001e71e283","imdb":"tt4154756","ps":"avengers-infinity-war","rd":"2018-04-25"},{"n":"Avengers: Endgame","ov":"After the devastating events of Avengers: Infinity War, the universe is in ruins due to the efforts of the Mad Titan, Thanos. With the help of remaining allies, the Avengers must assemble once more in order to undo Thanos' actions and restore order to the universe once and for all, no matter what consequences may be in store.","id":299534,"rt":181,"i":"/bR8ISy1O9XQxqiy0fQFw2BX72RQ.jpg","a1":"#2e1573","a2":"#d7a4a6","guid":"plex://movie/5d776b37fb0d55001f56046d","imdb":"tt4154796","ps":"avengers-endgame","rd":"2019-04-24"},{"n":"Deadpool \u0026 Wolverine","ov":"A listless Wade Wilson toils away in civilian life with his days as the morally flexible mercenary, Deadpool, behind him. But when his homeworld faces an existential threat, Wade must reluctantly suit-up again with an even more reluctant Wolverine.","id":533535,"rt":128,"i":"/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg","a1":"#660a14","a2":"#d3b7a2","guid":"plex://movie/5d776c8a23d5a3001f51c946","imdb":"tt6263850","ps":"deadpool-and-wolverine","rd":"2024-07-24"},{"n":"Shang-Chi and the Legend of the Ten Rings","ov":"Shang-Chi must confront the past he thought he left behind when he is drawn into the web of the mysterious Ten Rings organization.","id":566525,"rt":132,"i":"/9f2Q0U3IOsLgrI2HkvldwSABZy5.jpg","a1":"#1b5c7d","a2":"#c2c5c1","guid":"plex://movie/5d7770a7fb0d55001f5f5c83","imdb":"tt9376612","ps":"shang-chi-and-the-legend-of-the-ten-rings","rd":"2021-09-01"},{"n":"Eternals","ov":"The Eternals are a team of ancient aliens who have been living on Earth in secret for thousands of years. When an unexpected tragedy forces them out of the shadows, they are forced to reunite against mankind’s most ancient enemy, the Deviants.","id":524434,"rt":156,"i":"/lFByFSLV5WDJEv3KabbdAF959F2.jpg","a1":"#643c25","a2":"#d4c4a4","guid":"plex://movie/5d77704efb0d55001f5ed3a0","imdb":"tt9032400","ps":"eternals-2021","rd":"2021-11-03"},{"n":"Spider-Man: Far from Home","ov":"Peter Parker and his friends go on a summer trip to Europe. However, they will hardly be able to rest - Peter will have to agree to help Nick Fury uncover the mystery of creatures that cause natural disasters and destruction throughout the continent.","id":429617,"rt":129,"i":"/4q2NNj4S5dG2RLF9CpXsej7yXl.jpg","a1":"#043c62","a2":"#aac0d1","guid":"plex://movie/5d776d3196b655001fe42280","imdb":"tt6320628","ps":"spider-man-far-from-home","rd":"2019-06-28"},{"n":"Spider-Man: No Way Home","ov":"Peter Parker is unmasked and no longer able to separate his normal life from the high-stakes of being a super-hero. When he asks for help from Doctor Strange the stakes become even more dangerous, forcing him to discover what it truly means to be Spider-Man.","id":634649,"rt":148,"i":"/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg","a1":"#7b0f21","a2":"#d4b0a6","guid":"plex://movie/5e16138ce0d3ae001ed11b39","imdb":"tt10872600","ps":"spider-man-no-way-home","rd":"2021-12-15"},{"n":"Doctor Strange in the Multiverse of Madness","ov":"Doctor Strange, with the help of mystical allies both old and new, traverses the mind-bending and dangerous alternate realities of the Multiverse to confront a mysterious new adversary.","id":453395,"rt":126,"i":"/ddJcSKbcp4rKZTmuyWaMhuwcfMz.jpg","a1":"#8a0e0e","a2":"#c9a7a7","guid":"plex://movie/5d776d4796b655001fe44b28","imdb":"tt9419884","ps":"doctor-strange-in-the-multiverse-of-madness","rd":"2022-05-04"},{"n":"Black Panther: Wakanda Forever","ov":"Queen Ramonda, Shuri, M’Baku, Okoye and the Dora Milaje fight to protect their nation from intervening world powers in the wake of King T’Challa’s death.  As the Wakandans strive to embrace their next chapter, the heroes must band together with the help of War Dog Nakia and Everett Ross and forge a new path for the kingdom of Wakanda.","id":505642,"rt":162,"i":"/sv1xJUazXeYqALzczSZ3O6nkH75.jpg","a1":"#5c2c24","a2":"#cbc7b4","guid":"plex://movie/5d77702e6afb3d0020613fd1","imdb":"tt9114286","ps":"black-panther-wakanda-forever","rd":"2022-11-09"},{"n":"Thor: Love and Thunder","ov":"After his retirement is interrupted by Gorr the God Butcher, a galactic killer who seeks the extinction of the gods, Thor Odinson enlists the help of King Valkyrie, Korg, and ex-girlfriend Jane Foster, who now wields Mjolnir as the Mighty Thor. Together they embark upon a harrowing cosmic adventure to uncover the mystery of the God Butcher’s vengeance and stop him before it’s too late.","id":616037,"rt":119,"i":"/pIkRyD18kl4FhoCNQuWxWu5cBLM.jpg","a1":"#690544","a2":"#d1abb6","guid":"plex://movie/5e833eefc9edda0040cc5e04","imdb":"tt10648342","ps":"thor-love-and-thunder","rd":"2022-07-06"},{"n":"Werewolf by Night","ov":"On a dark and somber night, a secret cabal of monster hunters emerge from the shadows and gather at the foreboding Bloodstone Temple following the death of their leader. In a strange and macabre memorial to the leader’s life, the attendees are thrust into a mysterious and deadly competition for a powerful relic—a hunt that will ultimately bring them face to face with a dangerous monster.","id":894205,"rt":55,"i":"/mvIvNKRIJPPS7WSFarFhOAGIVnU.jpg","a1":"#593321","a2":"#c8b49d","guid":"plex://movie/613c7a5e1fe69c7d644a8e7d","imdb":"tt15318872","ps":"werewolf-by-night","rd":"2022-09-25"},{"n":"The Guardians of the Galaxy Holiday Special","ov":"On a mission to make Christmas unforgettable for Quill, the Guardians head to Earth in search of the perfect present.","id":774752,"rt":45,"i":"/8dqXyslZ2hv49Oiob9UjlGSHSTR.jpg","a1
